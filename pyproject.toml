[project]
name = "gobang"
version = "0.1.0"
description = "RL Gomoku demo with FastAPI backend and Vue frontend."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "numpy>=2.4.6",
    "torch>=2.14.1",
    "uvicorn>=0.32.0,<1.0.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
